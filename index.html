<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpaceX Live Launch Manifest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-hover: #182236;
      --border: #24324d;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --green: #34d399;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container { max-width: 1080px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    h1 { font-size: clamp(1.6rem, 3vw, 2.25rem); font-weight: 700; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 0.25rem; }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--surface-hover); border-color: var(--accent); }
    button.active { background: var(--accent); color: #05101a; font-weight: 600; border-color: var(--accent); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
    }

    /* Featured Next Launch Hero Card */
    .hero-card {
      background: linear-gradient(145deg, #131c31 0%, #0d1322 100%);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: center;
    }
    .hero-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .hero-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.4rem; }
    .hero-meta { color: var(--muted); font-size: 0.9rem; }
    .hero-countdown {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 600;
      color: var(--gold);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Launch Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-2px); border-color: #3b527e; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .badge-go { background: rgba(52, 211, 153, 0.15); color: var(--green); }
    .badge-tbc { background: rgba(245, 158, 11, 0.15); color: var(--gold); }
    .badge-other { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .card-cd {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .card h2 { font-size: 1.1rem; font-weight: 600; }
    .card-desc {
      font-size: 0.86rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .card-footer a { color: var(--accent); text-decoration: none; font-family: 'JetBrains Mono', monospace; }
    .card-footer a:hover { text-decoration: underline; }
    .error-box {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--red);
      color: #fecaca;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    @media (max-width: 680px) {
      .hero-card { grid-template-columns: 1fr; }
      .hero-countdown { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>SpaceX <span>Launch Telemetry</span></h1>
        <p class="subtitle">Auto-syncs live flight manifests on every page load via Launch Library 2</p>
      </div>
      <div class="controls">
        <button class="active" data-filter="ALL" onclick="setFilter('ALL')">All Vehicles</button>
        <button data-filter="Falcon" onclick="setFilter('Falcon')">Falcon 9 / Heavy</button>
        <button data-filter="Starship" onclick="setFilter('Starship')">Starship</button>
        <button onclick="fetchLaunches(true)">↻ Sync Now</button>
      </div>
    </header>

    <div class="status-bar">
      <div><span class="dot"></span><span id="sync-status">Connecting to live manifest...</span></div>
      <div id="local-clock">--:--:--</div>
    </div>

    <div id="error-container"></div>
    <div id="hero-container"></div>
    <div id="launches-grid" class="grid"></div>
  </div>

  <script>
    // SpaceX Agency ID in Launch Library 2 = 121
    const API_URL = 'https://ll.thespacedevs.com/2.2.0/launch/upcoming/?lsp__id=121&limit=18&mode=normal';
    const CACHE_KEY = 'spacex_ll2_cache_v1';
    const CACHE_TTL_MS = 5 * 60 * 1000; // 5-minute rate-limit buffer

    let allLaunches = [];
    let currentFilter = 'ALL';

    function formatCountdown(isoDate) {
      const diff = new Date(isoDate).getTime() - Date.now();
      const abs = Math.abs(diff);
      const d = Math.floor(abs / 86400000);
      const h = Math.floor((abs % 86400000) / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const pad = (n) => String(n).padStart(2, '0');
      const prefix = diff >= 0 ? 'T−' : 'T+';
      return d > 0 ? `${prefix}${d}d ${pad(h)}:${pad(m)}:${pad(s)}` : `${prefix}${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function formatLocalTime(isoDate) {
      return new Date(isoDate).toLocaleString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        timeZoneName: 'short'
      });
    }

    function getStatusBadge(statusObj) {
      const abbrev = statusObj?.abbrev || 'TBD';
      if (abbrev === 'Go') return `<span class="badge badge-go">GO FOR LAUNCH</span>`;
      if (abbrev === 'TBC' || abbrev === 'TBD') return `<span class="badge badge-tbc">${abbrev}</span>`;
      return `<span class="badge badge-other">${abbrev}</span>`;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function render() {
      const filtered = allLaunches.filter(l => {
        if (currentFilter === 'ALL') return true;
        const rocketName = l.rocket?.configuration?.name || '';
        return rocketName.toLowerCase().includes(currentFilter.toLowerCase());
      });

      const heroEl = document.getElementById('hero-container');
      const gridEl = document.getElementById('launches-grid');

      if (!filtered.length) {
        heroEl.innerHTML = '';
        gridEl.innerHTML = '<p style="color:var(--muted)">No upcoming launches match
